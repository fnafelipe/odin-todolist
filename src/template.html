<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
  </head>
  <body>
    <div class="container">
      <div class="pagebar">T A S K D O</div>

      <div class="projects-section">
        <h1>Projects</h1>
        <nav class="projects">
        </nav>
        <button class="add-project">Add Project +</button>
      </div>

      <div class="todos-section">
        <h1>Pending</h1>
        <nav class="pending-todos">
        </nav>
        <button class="add-todo">Add Todo +</button>
        <h1>Done</h1>
        <nav class="done-todos">
        </nav>
      </div>

      <div id="view">
      </div>
    </div>
  </body>
</html>
